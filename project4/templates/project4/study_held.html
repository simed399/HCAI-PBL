{% extends "base.html" %}
{% block content %}
  <h1>Additional Movie Ratings</h1>
  <p>Please rate the following movies to help us evaluate our system:</p>
  <form method="post">
    {% csrf_token %}
    <ul>
    {% for movie in movies %}
      <li>
        <strong>{{ movie.title }}</strong>
        <input name="r{{ movie.id }}" type="number" step="0.5" min="0.5" max="5" required>
      </li>
    {% endfor %}
    </ul>
    <button type="submit">Continue</button>
  </form>
{% endblock %}
