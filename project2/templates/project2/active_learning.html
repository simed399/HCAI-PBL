{% extends "base.html" %}
{% block content %}
  <h1>Project 2 – Pool-Based Active Learning</h1>
  <form method="post" action="{% url 'project2:run_active_learning' %}">
    {% csrf_token %}
    <label>Strategy:
      <select name="strategy">
        <option value="uncertainty">Uncertainty Sampling</option>
        <option value="margin">Margin Sampling</option>
        <option value="entropy">Entropy Sampling</option>
      </select>
    </label>
    <br/>
    <label>Number of Queries:
      <input type="number" name="n_queries" value="10" min="1" max="100"/>
    </label>
    <br/>
    <button type="submit">Query & Retrain</button>
  </form>
{% endblock %}
